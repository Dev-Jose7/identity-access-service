spring:
  r2dbc:
    url: ${APP_DOCKER_R2DBC_URL}
    username: ${APP_DOCKER_R2DBC_USERNAME}
    password: ${APP_DOCKER_R2DBC_PASSWORD}
    pool:
      enabled: ${APP_DOCKER_R2DBC_POOL_ENABLED:true}
      initial-size: ${APP_DOCKER_R2DBC_POOL_INITIAL_SIZE:5}
      max-size: ${APP_DOCKER_R2DBC_POOL_MAX_SIZE:20}
  data:
    redis:
      host: ${APP_DOCKER_REDIS_HOST}
      port: ${APP_DOCKER_REDIS_PORT}
      password: ${APP_DOCKER_REDIS_PASSWORD:}
      timeout: ${APP_DOCKER_REDIS_TIMEOUT:2s}
  kafka:
    bootstrap-servers: ${APP_DOCKER_KAFKA_BOOTSTRAP_SERVERS}
    client-id: ${APP_DOCKER_KAFKA_CLIENT_ID:identity-access-service-docker}
    listener:
      missing-topics-fatal: ${APP_DOCKER_KAFKA_LISTENER_MISSING_TOPICS_FATAL:false}
    producer:
      acks: ${APP_DOCKER_KAFKA_PRODUCER_ACKS:all}
      retries: ${APP_DOCKER_KAFKA_PRODUCER_RETRIES:3}
      properties:
        enable.idempotence: ${APP_DOCKER_KAFKA_PRODUCER_ENABLE_IDEMPOTENCE:true}
    consumer:
      group-id: ${APP_DOCKER_KAFKA_CONSUMER_GROUP_ID:identity-access-service-docker}
      auto-offset-reset: ${APP_DOCKER_KAFKA_CONSUMER_AUTO_OFFSET_RESET:earliest}
      enable-auto-commit: ${APP_DOCKER_KAFKA_CONSUMER_ENABLE_AUTO_COMMIT:false}

app:
  database:
    schema:
      initialize-on-startup: ${APP_DATABASE_SCHEMA_INITIALIZE_ON_STARTUP:true}
  security:
    jwt:
      private-key-path: ${APP_SECURITY_JWT_PRIVATE_KEY_PATH:classpath:keys/dev-private.pem}
      public-key-path: ${APP_SECURITY_JWT_PUBLIC_KEY_PATH:classpath:keys/dev-public.pem}
      additional-public-keys: ${APP_SECURITY_JWT_ADDITIONAL_PUBLIC_KEYS:}
