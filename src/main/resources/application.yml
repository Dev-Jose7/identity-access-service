spring:
  application:
    name: ${SPRING_APPLICATION_NAME:identity-access-service}
  main:
    web-application-type: reactive

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:false}
    register-with-eureka: ${EUREKA_CLIENT_REGISTER_WITH_EUREKA:false}
    fetch-registry: ${EUREKA_CLIENT_FETCH_REGISTRY:false}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info}
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    io.identityaccess: ${LOG_LEVEL_APP:INFO}
  pattern:
    console: ${LOG_PATTERN_CONSOLE:%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - %msg%n}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
    path: ${SPRINGDOC_API_DOCS_PATH:/v3/api-docs}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    path: ${SPRINGDOC_SWAGGER_UI_PATH:/swagger-ui.html}
    operations-sorter: ${SPRINGDOC_SWAGGER_UI_OPERATIONS_SORTER:alpha}
    tags-sorter: ${SPRINGDOC_SWAGGER_UI_TAGS_SORTER:alpha}

app:
  version: ${APP_VERSION:1.0.0}
  runtime:
    profile: ${SPRING_PROFILES_ACTIVE:}
  database:
    schema:
      initialize-on-startup: ${APP_DATABASE_SCHEMA_INITIALIZE_ON_STARTUP:false}
  dependencies:
    postgres:
      enabled: ${APP_DEP_POSTGRES_ENABLED:true}
    redis:
      enabled: ${APP_DEP_REDIS_ENABLED:true}
    kafka:
      enabled: ${APP_DEP_KAFKA_ENABLED:true}
  security:
    jwt:
      algorithm: ${APP_SECURITY_JWT_ALGORITHM:RS256}
      key-id: ${APP_SECURITY_JWT_KEY_ID:dev-rsa-key-1}
      private-key-path: ${APP_SECURITY_JWT_PRIVATE_KEY_PATH:classpath:keys/dev-private.pem}
      public-key-path: ${APP_SECURITY_JWT_PUBLIC_KEY_PATH:classpath:keys/dev-public.pem}
      additional-public-keys: ${APP_SECURITY_JWT_ADDITIONAL_PUBLIC_KEYS:}
      issuer: ${APP_SECURITY_JWT_ISSUER:identity-access-service}
      audience: ${APP_SECURITY_JWT_AUDIENCE:identity-access-client}
      access-token-ttl-seconds: ${APP_SECURITY_JWT_ACCESS_TTL_SECONDS:900}
      refresh-token-ttl-seconds: ${APP_SECURITY_JWT_REFRESH_TTL_SECONDS:604800}
      clock-skew-seconds: ${APP_SECURITY_JWT_CLOCK_SKEW_SECONDS:60}
      jwks-path: ${APP_SECURITY_JWT_JWKS_PATH:/.well-known/jwks.json}
  redis:
    cache:
      introspection-ttl-seconds: ${APP_REDIS_CACHE_INTROSPECTION_TTL_SECONDS:30}
      permissions-ttl-seconds: ${APP_REDIS_CACHE_PERMISSIONS_TTL_SECONDS:30}
    rate-limit:
      login-requests-per-minute: ${APP_REDIS_RATE_LIMIT_LOGIN_RPM:10}
      refresh-requests-per-minute: ${APP_REDIS_RATE_LIMIT_REFRESH_RPM:30}
      registration-requests-per-minute: ${APP_REDIS_RATE_LIMIT_REGISTRATION_RPM:5}
  iam:
    registration:
      public-enabled: ${APP_IAM_REGISTRATION_PUBLIC_ENABLED:true}
      public-default-role-code: ${APP_IAM_REGISTRATION_PUBLIC_DEFAULT_ROLE_CODE:ACCOUNT_USER}
      primary-enabled: ${APP_IAM_REGISTRATION_PRIMARY_ENABLED:true}
      primary-initial-role-code: ${APP_IAM_REGISTRATION_PRIMARY_INITIAL_ROLE_CODE:SYSTEM_ADMIN}
      admin-default-role-code: ${APP_IAM_REGISTRATION_ADMIN_DEFAULT_ROLE_CODE:ACCOUNT_USER}
      protected-role-codes: ${APP_IAM_REGISTRATION_PROTECTED_ROLE_CODES:SYSTEM_ADMIN}
  kafka:
    topics:
      session-opened: ${APP_KAFKA_TOPIC_SESSION_OPENED:iam.session-opened.v1}
      account-registered: ${APP_KAFKA_TOPIC_ACCOUNT_REGISTERED:iam.account-registered.v1}
      auth-failed: ${APP_KAFKA_TOPIC_AUTH_FAILED:iam.auth-failed.v1}
      session-refreshed: ${APP_KAFKA_TOPIC_SESSION_REFRESHED:iam.session-refreshed.v1}
      session-revoked: ${APP_KAFKA_TOPIC_SESSION_REVOKED:iam.session-revoked.v1}
      role-assigned-to-account: ${APP_KAFKA_TOPIC_ROLE_ASSIGNED_TO_ACCOUNT:iam.role-assigned-to-account.v1}
      account-blocked: ${APP_KAFKA_TOPIC_ACCOUNT_BLOCKED:iam.account-blocked.v1}
      account-unblocked: ${APP_KAFKA_TOPIC_ACCOUNT_UNBLOCKED:iam.account-unblocked.v1}
      role-created: ${APP_KAFKA_TOPIC_ROLE_CREATED:iam.role-created.v1}
      role-updated: ${APP_KAFKA_TOPIC_ROLE_UPDATED:iam.role-updated.v1}
      role-disabled: ${APP_KAFKA_TOPIC_ROLE_DISABLED:iam.role-disabled.v1}
      permission-created: ${APP_KAFKA_TOPIC_PERMISSION_CREATED:iam.permission-created.v1}
      permission-updated: ${APP_KAFKA_TOPIC_PERMISSION_UPDATED:iam.permission-updated.v1}
      permission-disabled: ${APP_KAFKA_TOPIC_PERMISSION_DISABLED:iam.permission-disabled.v1}
      permission-granted-to-role: ${APP_KAFKA_TOPIC_PERMISSION_GRANTED_TO_ROLE:iam.permission-granted-to-role.v1}
      permission-revoked-from-role: ${APP_KAFKA_TOPIC_PERMISSION_REVOKED_FROM_ROLE:iam.permission-revoked-from-role.v1}
  outbox:
    relay:
      enabled: ${APP_OUTBOX_RELAY_ENABLED:true}
      batch-size: ${APP_OUTBOX_RELAY_BATCH_SIZE:200}
      poll-interval-ms: ${APP_OUTBOX_RELAY_POLL_INTERVAL_MS:2000}
      max-retries: ${APP_OUTBOX_RELAY_MAX_RETRIES:3}
  sessions:
    expiration:
      enabled: ${APP_SESSIONS_EXPIRATION_ENABLED:true}
      sweep-interval-ms: ${APP_SESSIONS_EXPIRATION_SWEEP_INTERVAL_MS:60000}
  idempotency:
    processed-event:
      consumer-name: ${APP_IDEMPOTENCY_CONSUMER_NAME:identity-access-service}
