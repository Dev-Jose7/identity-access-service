services:
  identity-access-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: identity-access-service:local
    container_name: identity-access-service
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE_DOCKER:-docker}
      SERVER_PORT: ${SERVER_PORT:-8080}
      SPRING_APPLICATION_NAME: ${SPRING_APPLICATION_NAME:-identity-access-service}
      LOG_LEVEL_ROOT: ${LOG_LEVEL_ROOT:-INFO}
      LOG_LEVEL_APP: ${LOG_LEVEL_APP:-INFO}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:-health,info}
      APP_DOCKER_R2DBC_URL: ${APP_DOCKER_R2DBC_URL}
      APP_DOCKER_R2DBC_USERNAME: ${APP_DOCKER_R2DBC_USERNAME}
      APP_DOCKER_R2DBC_PASSWORD: ${APP_DOCKER_R2DBC_PASSWORD}
      APP_DOCKER_REDIS_HOST: ${APP_DOCKER_REDIS_HOST}
      APP_DOCKER_REDIS_PORT: ${APP_DOCKER_REDIS_PORT}
      APP_DOCKER_REDIS_PASSWORD: ${APP_DOCKER_REDIS_PASSWORD}
      APP_DOCKER_KAFKA_BOOTSTRAP_SERVERS: ${APP_DOCKER_KAFKA_BOOTSTRAP_SERVERS}
      APP_SECURITY_JWT_ALGORITHM: ${APP_SECURITY_JWT_ALGORITHM:-RS256}
      APP_SECURITY_JWT_KEY_ID: ${APP_SECURITY_JWT_KEY_ID:-dev-rsa-key-1}
      APP_SECURITY_JWT_PRIVATE_KEY_PATH: ${APP_SECURITY_JWT_PRIVATE_KEY_PATH:-classpath:keys/dev-private.pem}
      APP_SECURITY_JWT_PUBLIC_KEY_PATH: ${APP_SECURITY_JWT_PUBLIC_KEY_PATH:-classpath:keys/dev-public.pem}
      APP_SECURITY_JWT_ADDITIONAL_PUBLIC_KEYS: ${APP_SECURITY_JWT_ADDITIONAL_PUBLIC_KEYS:-}
      APP_SECURITY_JWT_ISSUER: ${APP_SECURITY_JWT_ISSUER:-identity-access-service}
      APP_SECURITY_JWT_AUDIENCE: ${APP_SECURITY_JWT_AUDIENCE:-identity-access-client}
      APP_IAM_REGISTRATION_PUBLIC_ENABLED: ${APP_IAM_REGISTRATION_PUBLIC_ENABLED:-true}
      APP_IAM_REGISTRATION_PUBLIC_DEFAULT_ROLE_CODE: ${APP_IAM_REGISTRATION_PUBLIC_DEFAULT_ROLE_CODE:-ACCOUNT_USER}
      APP_IAM_REGISTRATION_PRIMARY_ENABLED: ${APP_IAM_REGISTRATION_PRIMARY_ENABLED:-true}
      APP_IAM_REGISTRATION_PRIMARY_INITIAL_ROLE_CODE: ${APP_IAM_REGISTRATION_PRIMARY_INITIAL_ROLE_CODE:-SYSTEM_ADMIN}
      APP_IAM_REGISTRATION_ADMIN_DEFAULT_ROLE_CODE: ${APP_IAM_REGISTRATION_ADMIN_DEFAULT_ROLE_CODE:-ACCOUNT_USER}
      APP_IAM_REGISTRATION_PROTECTED_ROLE_CODES: ${APP_IAM_REGISTRATION_PROTECTED_ROLE_CODES:-SYSTEM_ADMIN}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  postgres:
    image: postgres:15
    container_name: identity-access-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./src/main/resources/db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: identity-access-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    container_name: identity-access-kafka
    ports:
      - "${KAFKA_EXTERNAL_PORT:-9092}:29092"
    environment:
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xms256m -Xmx512m}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:${KAFKA_EXTERNAL_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
